name: Dart CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dart-lang/setup-dart@v1
    - name: Install dependencies
      run: make deps
    - name: Lint
      run: make lint
    - name: Run tests
      run: make test
